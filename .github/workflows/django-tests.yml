name: Django frontend tests

on:
  push:
    paths:
      - "Django/**"
      - ".github/workflows/django-tests.yml"
  pull_request:
    paths:
      - "Django/**"
      - ".github/workflows/django-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    name: Run Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Django
    env:
      DJANGO_SECRET_KEY: ci-test-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Django
        run: python -m pip install Django==5.2.6

      - name: Run tests
        run: python manage.py test webplay
