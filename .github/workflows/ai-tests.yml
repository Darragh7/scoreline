name: AI tests

on:
  push:
    paths:
      - "ai/**"
      - ".github/workflows/ai-tests.yml"
  pull_request:
    paths:
      - "ai/**"
      - ".github/workflows/ai-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Run AI tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (ML libraries pinned as in backend/requirements.txt)
        run: python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.7.2 joblib==1.6.0 httpx==0.28.1 pytest==9.1.1 scipy

      - name: Run AI tests
        run: python -m pytest ai/training/tests -q
